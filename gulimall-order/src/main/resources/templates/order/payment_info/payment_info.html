<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('【请填写功能名称】列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>订单号：</label>
                                <input type="text" name="orderSn"/>
                            </li>
                            <li>
                                <label>订单id：</label>
                                <input type="text" name="orderId"/>
                            </li>
                            <li>
                                <label>支付宝交易流水号：</label>
                                <input type="text" name="alipayTradeNo"/>
                            </li>
                            <li>
                                <label>支付总金额：</label>
                                <input type="text" name="totalAmount"/>
                            </li>
                            <li>
                                <label>交易内容：</label>
                                <input type="text" name="subject"/>
                            </li>
                            <li>
                                <label>确认时间：</label>
                                <input type="text" class="time-input" placeholder="请选择确认时间" name="confirmTime"/>
                            </li>
                            <li>
                                <label>回调时间：</label>
                                <input type="text" class="time-input" placeholder="请选择回调时间" name="callbackTime"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="order:payment_info:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="order:payment_info:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="order:payment_info:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="order:payment_info:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('order:payment_info:edit')}]];
        var removeFlag = [[${@permission.hasPermi('order:payment_info:remove')}]];
        var prefix = ctx + "order/payment_info";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "【请填写功能名称】",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'orderSn',
                    title: '订单号'
                },
                {
                    field: 'orderId',
                    title: '订单id'
                },
                {
                    field: 'alipayTradeNo',
                    title: '支付宝交易流水号'
                },
                {
                    field: 'totalAmount',
                    title: '支付总金额'
                },
                {
                    field: 'subject',
                    title: '交易内容'
                },
                {
                    field: 'paymentStatus',
                    title: '支付状态'
                },
                {
                    field: 'confirmTime',
                    title: '确认时间'
                },
                {
                    field: 'callbackContent',
                    title: '回调内容'
                },
                {
                    field: 'callbackTime',
                    title: '回调时间'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>

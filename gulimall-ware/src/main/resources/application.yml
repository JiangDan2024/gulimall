spring:
  application:
    name: gulimall-ware

  cloud:
    nacos:
      # 全局地址和账号，discovery 和 config 都继承
#      server-addr: 10.201.215.224:8848 192.168.123.84:8848
      server-addr: 192.168.123.84:8848
      username: nacos
      password: nacos

      discovery:

      config:
        namespace: 384e6817-b4d0-4e33-8279-a0597727fe4f

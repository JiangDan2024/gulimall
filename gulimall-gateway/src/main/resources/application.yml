spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
#            - id: test_route
#              uri:
#                https://www.baidu.com
#              predicates:
#                - Query=url,baidu
#            - id: qq_route
#              uri:
#                https://www.qq.com
#              predicates:
#                - Query=url,qq

            - id: product_route
              uri: lb://gulimall-product
              predicates:
                - Path=/gulimall-api/product/**
              filters:
                - RewritePath=/gulimall-api/(?<segment>.*),/$\{segment}

            - id: member_route
              uri: lb://gulimall-member
              predicates:
                - Path=/gulimall-api/member/**
              filters:
                - RewritePath=/gulimall-api/(?<segment>.*),/$\{segment}

            - id: coupon_route
              uri: lb://gulimall-coupon
              predicates:
                - Path=/gulimall-api/coupon/**
              filters:
                - RewritePath=/gulimall-api/(?<segment>.*),/$\{segment}

            - id: ware_route
              uri: lb://gulimall-ware
              predicates:
                - Path=/gulimall-api/ware/**
              filters:
                - RewritePath=/gulimall-api/(?<segment>.*),/$\{segment}

            - id: third_party_route
              uri: lb://gulimall-third-party
              predicates:
                - Path=/gulimall-api/thirdparty/**
              filters:
                - RewritePath=/gulimall-api/(?<segment>.*),/$\{segment}
